name: Update events and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # 06:00 Asia/Seoul (UTC+9), previous UTC day
    - cron: '17 0 * * *' # 09:17 KST recovery for missed/delayed primary run
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: go-cal-pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s scripts -v
      - name: Collect and validate events
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Preserve last successful data and save attempt status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh validated event snapshot [skip ci]"
            git push
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report failed collection after publishing preserved data
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Data refresh failed. Previous valid data and latest failure status were deployed."
          exit 1
